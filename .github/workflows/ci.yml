name: Phishing Detection CI

on:
  push:
    branches:
      - qa-automation

  pull_request:
    branches:
      - qa-automation

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      #################################################
      # Go Backend
      #################################################

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Verify Go
        run: go version

      - name: Download Go Dependencies
        run: go mod download

      - name: Build Backend
        run: go build ./...

      - name: Run Backend Tests
        run: go test ./...

      #################################################
      # React Frontend
      #################################################

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install

      - name: Build Frontend
        working-directory: frontend
        run: npm run build

      #################################################
      # Upload Logs (only if something fails)
      #################################################

      - name: Upload Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: .